name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, types, security, unit tests, browser tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency audit (production high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit and API tests
        run: npm test

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python bridge dependencies
        run: python -m pip install -r bridge/requirements.txt

      - name: Verify nba_api imports and Python bridge tests
        run: |
          python -c "from nba_api.live.nba.endpoints import scoreboard; from nba_api.stats.endpoints import ScoreboardV3; from nba_api.stats.static import teams; print('NBA Python imports verified')"
          python -m unittest discover -s bridge/tests -v

      - name: Build
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Desktop/mobile browser and accessibility tests
        run: npm run test:e2e

      - name: Validate and build Docker Compose services
        env:
          NBA_API_BRIDGE_TOKEN: ci-test-not-a-real-secret
        run: |
          docker compose config --quiet
          docker compose build
          trap 'docker compose down --remove-orphans' EXIT
          docker compose up -d --no-build
          curl --retry 15 --retry-connrefused --retry-all-errors --retry-delay 2 --fail --silent --show-error http://127.0.0.1:3000/api/health
          curl --retry 8 --retry-all-errors --retry-delay 2 --fail --silent --show-error http://127.0.0.1:3000/api/teams -o /tmp/nba-teams.json
          python -c "import json; p=json.load(open('/tmp/nba-teams.json')); assert p['source']=='nba-api'; assert len(p['teams'])==30; print('Private NBA Python bridge returned 30 real static teams')"

      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: next-nba-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
